[package]
name = "accordion-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
accordion-types = { version = "0.1.0", path = "../accordion-types" }
argon2 = "0.6.0"
rusqlite = { version = "0.40.2", features = ["bundled", "uuid"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt", "sync"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
