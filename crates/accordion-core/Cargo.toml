[package]
name = "accordion-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
accordion-types = { version = "0.1.0", path = "../accordion-types" }
argon2 = "0.6.0"
base64ct = { version = "1.8.3", features = ["alloc"] }
getrandom = "0.4.3"
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
rusqlite = { version = "0.40.2", features = ["backup", "bundled", "uuid"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tracing = "0.1.44"
uuid = "1.28.0"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "test-util"] }
