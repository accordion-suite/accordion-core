[package]
name = "accordion-module"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
accordion-core = { version = "0.1.0", path = "../accordion-core" }
accordion-types = { version = "0.1.0", path = "../accordion-types" }
axum = "0.8.9"
base64ct = { version = "1.8.3", features = ["alloc"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["sync"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }
