[package]
name = "accordion-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The sync engine (decision 23), and `accordion-sync`, the command-line client
# that keeps a plain folder in sync on Linux. The desktop and phone apps use
# the same engine.

[dependencies]
# The same versions and features as the gateway's end of the tunnel, so the
# suite builds one copy.
base64 = "0.22.1"
bytes = "1.12.1"
gotatun = { version = "0.10.2", default-features = false, features = ["device", "ring"] }
http-body-util = "0.1.5"
# The same versions and features as the server's update check, so the suite
# builds one copy.
hyper = "1.12.0"
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "http2", "ring", "rustls-platform-verifier"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "http2", "tokio"] }
ipnetwork = "0.21.1"
# For dates in conflict copies' names, in the device's time zone. The same
# version and features as core.
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
ring = "0.17.14"
rusqlite = { version = "0.41.1", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
smoltcp = { version = "0.14.0", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
tower-service = "0.3.3"

[dev-dependencies]
tempfile = "3.27.0"
