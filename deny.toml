# cargo-deny settings, checked by the shared CI workflow.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# To accept a specific advisory, add its ID here with a comment explaining why.
ignore = []

[licenses]
# Licenses that can be combined with AGPL-3.0. Check compatibility before you
# add one.
allow = [
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# Accordion repos can depend on each other through Git.
[sources.allow-org]
github = ["accordion-suite"]
