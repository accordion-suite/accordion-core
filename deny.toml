# cargo-deny settings, checked by the shared CI workflow.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# To accept a specific advisory, add its ID here with a comment explaining why.
ignore = [
    # smallstr is unmaintained, with no known vulnerability. Only yrs uses it,
    # and yrs 0.28.1 is the newest release (November 2026). Drop this when
    # yrs moves off it.
    "RUSTSEC-2026-0215",
]

[licenses]
# Licenses that can be combined with AGPL-3.0. Check compatibility before you
# add one.
allow = [
    # smoltcp and others in the sync client's tunnel, as in the gateway.
    "0BSD",
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # Mozilla's root certificates in webpki-root-certs, which the sync client
    # uses on Windows, macOS, and phones. It's a license for data and asks
    # only that the license comes with the data (decision 23).
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# Accordion repos can depend on each other through Git.
[sources.allow-org]
github = ["accordion-suite"]
